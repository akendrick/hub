            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            text-align: center;
            padding: 10px;
        }

        .nav-button:hover {
            background-color: var(--btn-hover);
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }

        /* Hides button if it contains no text */
